# Render Blueprint — https://render.com/docs/blueprint-spec
# Backend API only. The React frontend is deployed separately on Vercel.
services:
  - type: web
    name: portfolio-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: PORT
        value: "5000"
      - key: WEB_CONCURRENCY
        value: "1"
      # Set these in the Render dashboard — do NOT commit real values here.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
