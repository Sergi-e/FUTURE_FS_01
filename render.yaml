# Render Blueprint — single service: Express API + React frontend served together.
# One URL, no CORS issues, no cross-origin env vars needed.
services:
  - type: web
    name: portfolio
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm install && npm run build && cp -r dist backend/dist
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: PORT
        value: "10000"
      - key: WEB_CONCURRENCY
        value: "1"
      # Set these in the Render dashboard — do NOT commit real values here.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
